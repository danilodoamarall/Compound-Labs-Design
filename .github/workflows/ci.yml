# O que o build protege, rodando a cada push e pull request.
#
# Substitui o workflow de modelo ("Hello, world!") que não fazia nada. Aqui roda
# exatamente o que se roda antes de publicar: lint, tipos, os testes dos scripts
# e o build — que traz no prebuild a checagem dos números citados nos artigos,
# a geração do índice, a checagem de links das skills e a checagem de contagens
# na prosa. Se algo divergir, o CI para e diz onde.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src

      - name: Tipos
        # Os tipos PageProps/LayoutProps são gerados pelo build; sem ele o tsc
        # não os encontra. Por isso o build vem antes.
        run: npm run build && npx tsc --noEmit
        env:
          # A data de geração do índice, fixa para o build ser reprodutível no CI.
          BUILD_DATE: 2026-09-04

      - name: Testes dos scripts
        run: node --test 'scripts/lib/*.test.mjs'

      - name: CLI empacota sem dependências
        working-directory: packages/skills-cli
        run: |
          node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('o CLI ganhou dependência:', p.dependencies); process.exit(1) }"
          npm pack --dry-run

  # Produção só sai daqui, e só depois de tudo acima passar: é o portão "só
  # publica se estiver ok". Não depende da integração Git da Vercel (que exige
  # a mesma conta no GitHub e na Vercel): usa a CLI com um token de deploy
  # guardado como segredo do repositório (VERCEL_TOKEN). Enquanto o segredo não
  # existir, o job avisa e termina verde, sem publicar.
  publicar:
    name: deploy de produção na Vercel
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_52WCkqpHdjlc0elwXFcNdKED
      VERCEL_PROJECT_ID: prj_QLC2rqJyzQMv01a9TF1rNMsthH4X
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # O runner do GitHub resolve IPv6 primeiro e a conexão com a Vercel
      # estourava em ETIMEDOUT no upload. IPv4 primeiro evita isso.
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Há token de deploy?
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::Sem VERCEL_TOKEN nos segredos do repositório; deploy pulado. Crie em https://vercel.com/account/tokens e adicione em Settings → Secrets → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala a CLI da Vercel
        if: steps.token.outputs.ok == 'true'
        run: npm i -g vercel@latest

      - name: Puxa configuração e variáveis de produção
        if: steps.token.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build de produção
        if: steps.token.outputs.ok == 'true'
        # O token do Actions autentica a chamada à API do GitHub que conta as
        # estrelas do repositório, para o build não cair no limite por IP.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publica o build já pronto
        if: steps.token.outputs.ok == 'true'
        # Três tentativas: o upload é a única etapa que depende da rede entre o
        # runner e a Vercel, e um timeout isolado não deve derrubar o deploy.
        run: |
          for tentativa in 1 2 3; do
            if vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"; then exit 0; fi
            echo "tentativa $tentativa falhou; aguardando 20s"
            sleep 20
          done
          exit 1
