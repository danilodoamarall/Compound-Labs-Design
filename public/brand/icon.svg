<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Labs">
  <title>Labs</title>
  <defs>
    <linearGradient id="base" x1="0.06" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0" stop-color="#bcd3f6"/>
      <stop offset="0.22" stop-color="#9bd8d1"/>
      <stop offset="0.45" stop-color="#f8f1e3"/>
      <stop offset="0.66" stop-color="#f8c98a"/>
      <stop offset="0.85" stop-color="#ef9d8c"/>
      <stop offset="1" stop-color="#d886b3"/>
    </linearGradient>
    <radialGradient id="violet" cx="0.14" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#8f7be0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#8f7be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.2" cy="0.74" r="0.55">
      <stop offset="0" stop-color="#2fbfa4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2fbfa4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.8" cy="0.22" r="0.44">
      <stop offset="0" stop-color="#ffb23f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb23f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta" cx="0.88" cy="0.84" r="0.5">
      <stop offset="0" stop-color="#e0559b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e0559b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.48" cy="0.4" r="0.36">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#fffdf7" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
    </filter>

    <!-- A marca do Labs em uma leitura só: um corpo orgânico cortado por um
         canal em S, que deixa duas lobas entrelaçadas, como duas folhas. O
         canal atravessa de ponta a ponta para cortar o corpo por inteiro. -->
    <mask id="split">
      <path fill="#fff" d="M512 168 C 646 168 856 306 856 512 C 856 702 698 856 512 856 C 322 856 168 694 168 512 C 168 314 378 168 512 168 Z"/>
      <path fill="none" stroke="#000" stroke-width="74" stroke-linecap="round"
            d="M520 112 C 706 300 660 424 512 512 C 364 600 318 726 504 912"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="#333331"/>
  <rect width="1024" height="1024" rx="232" fill="#ffffff" filter="url(#grain)" opacity="0.5" style="mix-blend-mode:overlay"/>

  <g mask="url(#split)">
    <rect width="1024" height="1024" fill="url(#base)"/>
    <rect width="1024" height="1024" fill="url(#violet)"/>
    <rect width="1024" height="1024" fill="url(#teal)"/>
    <rect width="1024" height="1024" fill="url(#amber)"/>
    <rect width="1024" height="1024" fill="url(#magenta)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="#ffffff" filter="url(#grain)" opacity="0.55" style="mix-blend-mode:overlay"/>
  </g>
</svg>
