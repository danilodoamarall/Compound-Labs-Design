<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Builders Lab">
  <title>AI Builders Lab</title>
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="224" y1="430" x2="800" y2="560">
      <stop offset="0" stop-color="#a9c0da"/>
      <stop offset="0.14" stop-color="#bccee0"/>
      <stop offset="0.28" stop-color="#d2dce4"/>
      <stop offset="0.4" stop-color="#e6e2da"/>
      <stop offset="0.52" stop-color="#f5e0bb"/>
      <stop offset="0.66" stop-color="#f4c396"/>
      <stop offset="0.82" stop-color="#eda482"/>
      <stop offset="1" stop-color="#dc8d7b"/>
    </linearGradient>
    <radialGradient id="luz" gradientUnits="userSpaceOnUse" cx="430" cy="350" r="255">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fundo" gradientUnits="userSpaceOnUse" cx="512" cy="785" r="300">
      <stop offset="0" stop-color="#4b3f5e" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4b3f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="ruido"/>
      <feColorMatrix in="ruido" type="saturate" values="0" result="cinza"/>
      <feComponentTransfer in="cinza" result="grao">
        <feFuncA type="linear" slope="0.17" intercept="0"/>
      </feComponentTransfer>
      <feComposite in="grao" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="domo">
      <path d="M230 603 A300 300 0 1 1 794 603 C800 700 794 744 760 740 C652 688 388 692 294 752 C244 766 224 706 230 603 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#domo)">
    <rect width="1024" height="1024" fill="url(#mat)"/>
    <rect width="1024" height="1024" fill="url(#fundo)"/>
    <rect width="1024" height="1024" fill="url(#luz)"/>
    <rect width="1024" height="1024" fill="#fff" filter="url(#grao)" opacity="0.5"/>
  </g>
</svg>
